# Olympic Academy production configuration
server.port=7002
server.address=127.0.0.1

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/olympic_academy_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Cairo}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.frontend.url=${APP_FRONTEND_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.production=true
app.bootstrap.enabled=false

logging.level.root=INFO
logging.level.bs=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
server.error.include-message=never
server.error.include-binding-errors=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.logfile.enabled=false

spring.liquibase.enabled=false
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

backup.enabled=true
backup.interval.days=1
backup.mysqldump.path=${MYSQLDUMP_PATH:C:/Program Files/MySQL/MySQL Server 8.0/bin/mysqldump.exe}
