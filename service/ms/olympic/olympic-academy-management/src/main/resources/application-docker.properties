# ===================================================================
# OLYMPIC ACADEMY - DOCKER CONFIGURATION
# ===================================================================

# -------------------------------------------------------------------
# Server
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://mysql:3306/olympic_academy_db_2?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Cairo
spring.datasource.username=root
spring.datasource.password=25251436
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# -------------------------------------------------------------------
# JPA
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Liquibase (disabled ? schema is managed externally via the liquibase profile)
# -------------------------------------------------------------------
spring.liquibase.enabled=false

# -------------------------------------------------------------------
# App URLs
# -------------------------------------------------------------------
app.base.url=http://localhost:7002
app.production=true

# Performance settings
app.performance.max-query-timeout=30000
app.performance.page-size=20
app.performance.max-page-size=50

# -------------------------------------------------------------------
# External API
# -------------------------------------------------------------------
external.api.countries.url=https://restcountries.com/v3.1
external.api.timeout=5000

# -------------------------------------------------------------------
# Email (needed by EmailServiceImpl)
# -------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=m.ehab.rabea@gmail.com
spring.mail.password=dltkdakmdzaujvwc
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# -------------------------------------------------------------------
# Scheduler
# -------------------------------------------------------------------
token.cleanup.fixed-rate=3600000
spring.task.scheduling.enabled=true
spring.task.scheduling.pool.size=1
spring.task.scheduling.thread-name-prefix=token-cleanup-

# -------------------------------------------------------------------
# Backup (disabled in Docker)
# -------------------------------------------------------------------
backup.enabled=false

# -------------------------------------------------------------------
# Thymeleaf
# -------------------------------------------------------------------
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=true
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# File Upload
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB

# -------------------------------------------------------------------
# Dev tools (disabled)
# -------------------------------------------------------------------
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.jmx.enabled=false

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.bs=INFO
logging.level.liquibase=INFO