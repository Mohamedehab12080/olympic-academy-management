services:
  mysql:
    image: mysql:8
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 25251436
      MYSQL_DATABASE: olympic_academy_db_2
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p25251436"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: olympic-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 7002
    ports:
      - "7002:7002"
    command:
      - "--spring.datasource.url=jdbc:mysql://mysql:3306/olympic_academy_db_2?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Cairo"
      - "--spring.datasource.username=root"
      - "--spring.datasource.password=25251436"
    restart: unless-stopped

volumes:
  mysql_data: